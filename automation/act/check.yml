name: Local Android checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Load local workspace
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          clean: false

      - name: Prepare isolated copy of local sources
        run: |
          set -euo pipefail
          test "${ACT:-}" = true
          mkdir -p "$RUNNER_TEMP/glider-check"
          tar --exclude=.git --exclude=.gradle --exclude=.kotlin --exclude=build \
            --exclude=local.properties --exclude=bootstrap --exclude='*.jks' \
            --exclude='*.keystore' --exclude=key.properties --exclude=.secrets \
            --exclude=.act-artifacts --exclude=plans --exclude=screenshots \
            -cf - app gradle gradlew gradlew.bat build.gradle.kts settings.gradle.kts \
            gradle.properties .editorconfig | tar -xf - -C "$RUNNER_TEMP/glider-check"
          echo "PROJECT_DIR=$RUNNER_TEMP/glider-check" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Check and build
        working-directory: ${{ env.PROJECT_DIR }}
        run: bash ./gradlew ktlintCheck :app:lintRelease :app:assembleDebug --console=plain

      - name: Save APK and reports locally
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glider-check
          if-no-files-found: error
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
            ${{ env.PROJECT_DIR }}/app/build/reports/
