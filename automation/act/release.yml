name: Local signed Android release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing remote release tag, for example v3.0.0
        required: true
        type: string
      commit:
        description: Full 40-character commit SHA referenced by the tag
        required: true
        type: string
      create_draft:
        description: Upload the signed APK to a draft GitHub Release
        default: false
        type: boolean
      local_source:
        description: Build an exact local commit before pushing its release tag
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      RELEASE_REPOSITORY: Systemad/Glider
    steps:
      - name: Load local workspace
        if: ${{ inputs.local_source == true || inputs.local_source == 'true' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          clean: false

      - name: Fetch exact release sources
        env:
          LOCAL_SOURCE: ${{ inputs.local_source }}
        run: |
          set -euo pipefail
          test "${ACT:-}" = true
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?([.-][A-Za-z0-9.-]+)?$ ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$LOCAL_SOURCE" == true ]]; then
            mkdir -p "$RUNNER_TEMP/glider-release"
            git archive "$RELEASE_COMMIT" | tar -xf - -C "$RUNNER_TEMP/glider-release"
          else
            git clone --depth 1 --branch "$RELEASE_TAG" \
              "https://github.com/$RELEASE_REPOSITORY.git" "$RUNNER_TEMP/glider-release"
            test "$(git -C "$RUNNER_TEMP/glider-release" rev-parse HEAD)" = "$RELEASE_COMMIT"
          fi
          echo "PROJECT_DIR=$RUNNER_TEMP/glider-release" >> "$GITHUB_ENV"
          echo "RELEASE_DIR=$RUNNER_TEMP/glider-release-assets" >> "$GITHUB_ENV"

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Build signed release and debug APKs
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_KEYSTORE_PATH: /run/glider-signing.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bash ./gradlew ktlintCheck :app:lintRelease :app:assembleRelease :app:assembleDebug --console=plain
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          metadata = json.loads(Path('app/build/outputs/apk/release/output-metadata.json').read_text())
          versions = {entry['versionName'] for entry in metadata['elements']}
          if versions != {os.environ['RELEASE_TAG'].removeprefix('v')}:
              raise SystemExit('APK versionName must match the release tag without its v prefix')
          if metadata['applicationId'] == 'nl.viter.glider':
              raise SystemExit('Choose a unique applicationId for this independent fork before releasing')
          PY

      - name: Verify and collect APKs
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_DIR"
          tools="$ANDROID_HOME/build-tools/37.0.0"
          cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" "$RELEASE_DIR/glider-$RELEASE_TAG.apk"
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$RELEASE_DIR/glider-$RELEASE_TAG-debug.apk"
          "$tools/apksigner" verify --verbose "$RELEASE_DIR/glider-$RELEASE_TAG.apk"
          "$tools/apksigner" verify --verbose "$RELEASE_DIR/glider-$RELEASE_TAG-debug.apk"
          cd "$RELEASE_DIR"
          sha256sum "glider-$RELEASE_TAG.apk" "glider-$RELEASE_TAG-debug.apk" > SHA256SUMS

      - name: Save signed release and R8 mapping locally
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glider-signed-release
          if-no-files-found: error
          path: |
            ${{ env.RELEASE_DIR }}/glider-${{ inputs.tag }}.apk
            ${{ env.RELEASE_DIR }}/glider-${{ inputs.tag }}-debug.apk
            ${{ env.RELEASE_DIR }}/SHA256SUMS
            ${{ env.PROJECT_DIR }}/app/build/outputs/mapping/release/mapping.txt

      - name: Create draft GitHub Release
        if: ${{ inputs.create_draft == true || inputs.create_draft == 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: Systemad/Glider
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ inputs.commit }}
          name: ${{ inputs.tag }}
          draft: true
          prerelease: ${{ contains(inputs.tag, '-beta') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ env.RELEASE_DIR }}/glider-${{ inputs.tag }}.apk
            ${{ env.RELEASE_DIR }}/glider-${{ inputs.tag }}-debug.apk
            ${{ env.RELEASE_DIR }}/SHA256SUMS
