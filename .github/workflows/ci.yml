name: CI
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bootstrap workspace
        uses: ./.github/actions/bootstrap
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Run static analysis checks
        run: melos lint
      - name: Build Android APK (profile)
        run: fvm flutter build apk --profile
      - name: Upload APK (profile) artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-profile.apk
          path: build/app/outputs/apk/profile/app-profile.apk

  native-android:
    name: Native Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Check and build Compose app
        run: bash ./gradlew ktlintCheck :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: glider-native-debug
          path: android/native/app/build/outputs/apk/debug/app-debug.apk
